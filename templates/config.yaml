mixxx:
  url: "http://localhost:7778"
  timeout: 5
  auto_start: true
  binary: ""
  resource_path: ""
  settings_path: ""

llm:
  model: "{llm_model}"
  api_base: "{llm_api_base}"
  api_key: ""
  temperature: 0.7
  timeout: 30

library:
  music_dir: "~/Music/{dj_name_slug}"

transitions:
  lookahead_seconds: 120
  default_duration: 60
  fps: 20

daemon:
  heartbeat_interval_seconds: 30.0
  pulse_interval_seconds: 5.0
  poll_hz: 2
  max_errors: 10

capabilities:
  allow_shell: false

set:
  default_mood: "{default_mood}"
  energy_max_jump: 2
  peak_max_consecutive: 3
