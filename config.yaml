mixxx:
  url: "http://localhost:7778"
  timeout: 5
  auto_start: true
  # Leave empty to use defaults: ~/workspace/mixxx-treta/build/mixxx (macOS)
  binary: ""
  resource_path: ""
  settings_path: ""

llm:
  model: "openai/gemini-3-flash"
  api_base: "http://localhost:4000"
  # Prefer env: DJTRETA_LLM_API_KEY or LLM_API_KEY (overrides this field)
  api_key: ""
  temperature: 0.7
  timeout: 30

library:
  music_dir: "~/Music/DJTreta"

transitions:
  lookahead_seconds: 120
  default_duration: 60
  fps: 20

daemon:
  heartbeat_interval_seconds: 30.0
  pulse_interval_seconds: 5.0  # legacy
  poll_hz: 2
  max_errors: 10

capabilities:
  # Set true only on a trusted machine; agent can run arbitrary shell commands when enabled
  allow_shell: false

planner:
  replan_every_n_tracks: 2
  download_new_tracks: 3
  min_play_time_seconds: 90

sets:
  auto_mode: true
  default_duration_minutes: 120
  recording_dir: "~/Music/DJTreta/recordings"

relay:
  enabled: true
  server_url: "wss://dj.treta.life/ws/relay"
  token: ""  # set in .env: DJTRETA_RELAY_TOKEN
  push_hz: 3

broadcast:
  auto_start: true

set:
  default_mood: "techno-deep"
  energy_max_jump: 2
  peak_max_consecutive: 3
