mixxx:
  url: "http://localhost:7778"
  timeout: 5
  auto_start: true
  # Leave empty to use defaults: ~/workspace/mixxx-treta/build/mixxx (macOS)
  binary: ""
  resource_path: ""
  # Mixxx 3.0 fresh profile — keeps the live 2.7 profile untouched (3.0 refuses
  # to share a 2.7 profile: data-corruption risk). Re-map FLX4 + audio here.
  settings_path: "~/Library/Application Support/Mixxx-3.0"

llm:
  model: "openai/gemini-3-flash"
  api_base: "http://localhost:4000"
  # Prefer env: DJTRETA_LLM_API_KEY or LLM_API_KEY (overrides this field)
  api_key: ""
  temperature: 0.7
  timeout: 30

library:
  music_dir: "~/Music/DJTreta"

transitions:
  lookahead_seconds: 120
  default_duration: 60
  fps: 20

daemon:
  heartbeat_interval_seconds: 30.0
  pulse_interval_seconds: 5.0  # legacy
  poll_hz: 2
  max_errors: 10

capabilities:
  # Set true only on a trusted machine; agent can run arbitrary shell commands when enabled
  allow_shell: false

planner:
  replan_every_n_tracks: 2
  download_new_tracks: 3
  generate_new_tracks: 1
  min_play_time_seconds: 90

sets:
  auto_mode: true
  default_duration_minutes: 120
  recording_dir: "~/Music/DJTreta/recordings"
  local_recording: false  # server records via Icecast, no need for local

relay:
  enabled: true  # VM (production) pushes state to dj.treta.life relay-ws
  server_url: "wss://dj.treta.life/ws/relay"
  token: ""  # set in .env: DJTRETA_RELAY_TOKEN
  push_hz: 3

broadcast:
  auto_start: false  # VM handles broadcast; Mac stays silent

producer:
  enabled: false
  model: "lyria-3-pro-preview"
  vertex_project: ""  # set via DJTRETA_VERTEX_PROJECT env var
  vertex_location: "global"
  default_duration_seconds: 180
  genre_dir: "ai-generated"

sources:
  youtube: true
  treta_originals: false

knowledge:
  enabled: false  # LanceDB rebuild pending. With vectors gone, v9 surfacing returns a thin candidate set and Flash hallucinates around it — flip back to true once vectors are restored.
  data_dir: "~/Music/DJTreta/knowledge"
  embedding_model: "text-embedding-005"  # used for online query embedding (similar_to_text)
  embedding_dim: 384                     # Matryoshka-truncated from 768

set:
  default_mood: "melodic techno"
  energy_max_jump: 2
  peak_max_consecutive: 3

evolution:
  enabled: false
  reflect_every_n_tracks: 5
  auto_evolve: false
  max_evolve_per_day: 2
  max_budget_per_evolve_usd: 0.50
  require_tests: true
