mixxx:
  url: "http://localhost:7778"
  timeout: 5
  auto_start: true
  # Leave empty to use defaults: ~/workspace/mixxx-treta/build/mixxx (macOS)
  binary: ""
  resource_path: ""
  # Mixxx 3.0 fresh profile — keeps the live 2.7 profile untouched (3.0 refuses
  # to share a 2.7 profile: data-corruption risk). Re-map FLX4 + audio here.
  settings_path: "~/Library/Application Support/Mixxx-3.0"

llm:
  model: "openai/gemini-3-flash"
  # Being (Treta's own reasoning) on pro — flash didn't follow instructions
  # reliably and skipped tool calls (reverted 2026-05-23). Subagents stay flash.
  being_model: "openai/gemini-3-flash"
  api_base: "http://localhost:4000"
  # Prefer env: DJTRETA_LLM_API_KEY or LLM_API_KEY (overrides this field)
  api_key: ""
  # 1.0 for tool use — Google's guidance: Gemini loops on repeated tool calls
  # far more below 1.0 (and Gemini 3 expects 1.0). Was 0.7 (2026-05-24).
  temperature: 1.0
  timeout: 30
  # NS-003: OPTIONAL per-agent model map. Absent → today's behavior
  # (`model` for all agent loops, `being_model` for the Being). Keys are
  # actual agent names (mixer, library, dj_treta, producer, planner, treta,
  # library_manager) or the aliases dj / being / library_peer. Unnamed
  # agents fall back to model/being_model. Per-agent endpoint overrides go
  # in model_overrides (same keys, {api_base, api_key}).
  # models:
  #   planner: openai/gemini-flash
  #   dj: openai/gemini-flash
  #   being: openai/gemini-pro
  #   library_peer: openai/gemini-flash
  # model_overrides:
  #   being:
  #     api_base: "http://localhost:4001"
  #     api_key: ""  # prefer env vars for real keys

library:
  music_dir: "~/Music/DJTreta"

transitions:
  lookahead_seconds: 120
  default_duration: 60
  fps: 20
  # --- E1/E2 (integrator: merge into transitions config; not yet read by code,
  # documents the intended knobs so the executor/loader can wire them) ---
  # E1 master clock / bar-quantize:
  beats_per_bar: 4          # 4/4 assumed; bar = downbeat every 4 beats
  bar_quantize: true        # start blends on the outgoing deck's next downbeat
  quantize_on_load: true    # assert Mixxx [ChannelN] quantize=1 (cue/loop snap)
  bar_wait_timeout_s: 4.0   # max wait for a bar boundary before firing anyway
  # E2 native-FX effect-unit assignments (EffectRack1):
  fx_unit_echo: 1           # do_echo_out  (pre-loaded Echo expected in Unit1)
  fx_unit_delay: 2          # do_delay_throw (Delay/Echo in Unit2)
  fx_unit_reverb: 3         # do_reverb_tail (Reverb in Unit3)

daemon:
  heartbeat_interval_seconds: 30.0
  pulse_interval_seconds: 5.0  # legacy
  poll_hz: 2
  max_errors: 10

capabilities:
  # Set true only on a trusted machine; agent can run arbitrary shell commands when enabled
  allow_shell: false

planner:
  replan_every_n_tracks: 2
  download_new_tracks: 3
  generate_new_tracks: 1
  min_play_time_seconds: 90

sets:
  auto_mode: true
  default_duration_minutes: 120
  recording_dir: "~/Music/DJTreta/recordings"
  local_recording: false  # server records via Icecast, no need for local

relay:
  enabled: true  # VM (production) pushes state to dj.treta.life relay-ws
  server_url: "wss://dj.treta.life/ws/relay"
  token: ""  # set in .env: DJTRETA_RELAY_TOKEN
  push_hz: 3

broadcast:
  auto_start: false  # VM handles broadcast; Mac stays silent

producer:
  enabled: false
  model: "lyria-3-pro-preview"
  vertex_project: ""  # set via DJTRETA_VERTEX_PROJECT env var
  vertex_location: "global"
  default_duration_seconds: 180
  genre_dir: "ai-generated"

sources:
  youtube: true
  treta_originals: false

knowledge:
  enabled: false  # LanceDB rebuild pending. With vectors gone, v9 surfacing returns a thin candidate set and Flash hallucinates around it — flip back to true once vectors are restored.
  data_dir: "~/Music/DJTreta/knowledge"
  embedding_model: "text-embedding-005"  # used for online query embedding (similar_to_text)
  embedding_dim: 384                     # Matryoshka-truncated from 768

# --- E3/E5 ---  Library ingestion (Rekordbox/Serato import + arrangement).
ingestion:
  # When a DJ-library import covers a track (cues + grid), skip the slow
  # librosa pass for it. Only un-covered tracks fall back to librosa.
  prefer_import_over_librosa: true
  # Run the librosa fallback automatically after an import to reach 100%
  # analysis coverage. Set false for import-only (fast) runs.
  librosa_backfill_after_import: true
arrangement:
  # E5 leapfrog: the planner emits a rolling sequence of musical intents
  # toward a goal each cycle. max_steps caps the horizon length.
  enabled: true
  max_steps: 4
  default_bars_per_step: 16

set:
  default_mood: "melodic techno"
  energy_max_jump: 2
  peak_max_consecutive: 3

evolution:
  enabled: false
  reflect_every_n_tracks: 5
  auto_evolve: false
  max_evolve_per_day: 2

# --- E6 Visuals ---
# Generative Visual Layer — drives live reactive visuals from Treta's audio.
# Everything here is disabled by default; flip enabled: true ONLY on a local
# dev machine (never on the live VM until v10 integration is stable).
#
# OSC parity: same /treta/* address schema as deadmau5's TouchDesigner hook,
# so any OSC visual app (TD, Max/MSP, resolume, p5.js bridge) can react.
#
# Omni: prototype Gemini Omni reactive video generation.  Requires the model
# to be reachable via your LiteLLM gateway.  Set omni.enabled: true only
# after confirming model access (see agent/visuals/omni.py for setup steps).
visuals:
  enabled: false                   # master guard — never let this affect the live set
  omni_interval_seconds: 30.0      # minimum gap between Omni generation calls (s)
  osc:
    host: "127.0.0.1"             # OSC target host (change to TD machine IP for networked setup)
    port: 7000                    # OSC target port (match your TouchDesigner / visual app)
  omni:
    enabled: false                 # flip true once you've confirmed Gemini Omni model access
    model: ""                      # leave empty to try candidates: gemini-omni-flash → flash → 1.5-flash
  max_budget_per_evolve_usd: 0.50
  require_tests: true
