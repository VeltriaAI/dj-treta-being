description = "v5 audio analysis pipeline for DJ Treta knowledge dataset"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.0",
    "pyarrow>=15.0",
    "huggingface_hub>=0.20",
    "google-cloud-storage>=2.10",
    "yt-dlp>=2024.1.1",
    "essentia>=2.1b6",
    "librosa>=0.10",
    "numpy>=1.24,<2.0",
    "scipy>=1.10",
]
