# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
#
# Release pipeline for the djclaw Python package.
#
# On a `v*` tag push: builds the source distribution + wheel, then
# uploads both to a GitHub Release at that tag. The unified install.sh
# (curl -fsSL https://dj.treta.life/install.sh | sh) pulls the sdist
# tarball from this release and pip-installs it into the user's venv.
#
# Stable URL pattern (consumed by install.sh):
#   https://github.com/VeltriaAI/dj-treta-being/releases/download/v$VERSION/djclaw-$VERSION.tar.gz

name: Release DJClaw

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v9.1.2). Must already exist."
        required: true
        type: string

permissions:
  contents: write   # required to create the release + upload assets

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Sync package version to the release tag
        run: |
          # Artifacts MUST be named/versioned to match the tag, or the VM
          # auto-updater (compares installed version vs latest tag, downloads
          # djclaw-<version>.tar.gz) can neither detect nor find them.
          # Historically version was hand-set in pyproject.toml and never
          # bumped, so every release shipped 9.1.2 artifacts regardless of tag.
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          echo "$VER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([-.].+)?$' \
            || { echo "tag '$TAG' is not valid semver" >&2; exit 1; }
          sed -i -E "s/^version = \".*\"/version = \"$VER\"/" pyproject.toml
          echo "built version:"; grep -E '^version = ' pyproject.toml

      - name: Build sdist + wheel
        run: |
          python -m build
          ls -la dist/

      - name: Verify sdist is installable
        run: |
          # Quick sanity check — pip install the sdist into a throwaway
          # venv so we catch packaging mistakes (missing files, bad
          # entry points) before users hit them via install.sh.
          python -m venv /tmp/verify-venv
          /tmp/verify-venv/bin/pip install --quiet dist/djclaw-*.tar.gz
          /tmp/verify-venv/bin/djclaw --help >/dev/null 2>&1 \
            || { echo "djclaw entry point broken in built sdist" >&2; exit 1; }
          echo "sdist installs and djclaw CLI is reachable"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/djclaw-*.tar.gz
            dist/djclaw-*.whl
