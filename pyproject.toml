[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "djclaw"
version = "9.1.2"
description = "Install your own AI DJ Being — powered by Google ADK"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "google-adk",
    "litellm",
    "httpx",
    "pyyaml",
    "textual",
    "rich",
    "google-genai",
    "mutagen",
    "librosa",
    "websockets",
    "anyio",
]

[project.scripts]
djclaw = "cli:main"

[tool.setuptools]
py-modules = ["cli", "tui"]

[tool.setuptools.packages.find]
include = ["agent*", "mcp_server*"]

[tool.setuptools.package-data]
# Templates use a `.tpl` suffix in agent/templates/ (config.yaml.tpl,
# secrets.env.tpl, litellm.yaml.tpl). The setup wizard reads them at
# runtime via `Path(__file__).parent / "templates" / "..."`, so they
# MUST be packaged into the sdist — otherwise the first end-user
# install hits FileNotFoundError. (Caught by code review on PR #79.)
agent = ["templates/*.tpl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "eval_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -x"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "eval: prompt eval tests requiring LLM access (deselect with '-m \"not eval\"')",
]
