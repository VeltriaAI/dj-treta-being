<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VDJ Treta</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud {
    position: fixed; left: 14px; top: 12px; z-index: 10;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: rgba(255,255,255,.82); text-shadow: 0 1px 3px rgba(0,0,0,.9);
    background: rgba(0,0,0,.28); padding: 8px 11px; border-radius: 8px;
    pointer-events: none; white-space: pre; display: none;
  }
  #hud b { color: #7ef0d4; font-weight: 600; }
  #nowplaying {
    position: fixed; left: 0; right: 0; bottom: 26px; z-index: 9;
    text-align: center; pointer-events: none;
    font: 400 15px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif;
    color: rgba(255,255,255,.0); transition: color .8s ease;
    text-shadow: 0 2px 12px rgba(0,0,0,.85); letter-spacing: .04em;
  }
  #nowplaying .t { font-size: 20px; font-weight: 600; display: block; }
  #nowplaying.show { color: rgba(255,255,255,.92); }
</style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="hud"></div>
  <div id="nowplaying"><span class="t"></span><span class="a"></span></div>
  <script type="module" src="./vdj.js"></script>
</body>
</html>
